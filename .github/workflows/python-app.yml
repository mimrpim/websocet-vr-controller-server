name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Zastaví sestavení při závažných syntaktických chybách nebo nedefinovaných proměnných
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check Python syntax (compileall)
      run: |
        # Zkontroluje úplně všechny Python soubory v projektu
        python -m compileall -q .

    - name: Test with pytest
      run: |
        # Spustí testy, pokud existují; pokud ne, projde bez chyby
        pytest --pass-empty-tests
