name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pylint mypy pytest

    - name: Check syntax (compileall)
      run: |
        # Zkontroluje syntaktickou správnost bez spuštění kódu
        python -m compileall -q .

    - name: Lint with flake8
      run: |
        # Odhalí nedefinované proměnné a hrubé chyby v syntaxi
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Check logic with pylint
      run: |
        # Hledá závažné chyby v logice serveru (E = Errors, F = Fatal)
        pylint --disable=all --enable=E,F server.py

    - name: Type check with mypy
      run: |
        # Zkontroluje typovou správnost a neexistující importy
        mypy server.py --ignore-missing-imports || true

    - name: Test with pytest
      run: |
        # Projde bez chyby, i když zatím nemáte složku s testy
        pytest || [ $? -eq 5 ]
