<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Klient</title>
</head>
<body>
    <h2>WebSocket Test</h2>
    <input type="text" id="inputMsg" placeholder="Napiš zprávu...">
    <button onclick="send()">Odeslat</button>
    <div id="log" style="margin-top: 15px; font-family: monospace;"></div>

    <script>
        const ws = new WebSocket("ws://localhost:8765");

        ws.onopen = () => addLog("✅ Připojeno k serveru");
        ws.onmessage = (event) => addLog("📩 Server: " + event.data);
        ws.onclose = () => addLog("❌ Odpojeno od serveru");

        function send() {
            const input = document.getElementById("inputMsg");
            if (input.value) {
                ws.send(input.value);
                input.value = "";
            }
        }

        function addLog(msg) {
            document.getElementById("log").innerHTML += msg + "<br>";
        }
    </script>
</body>
</html>
